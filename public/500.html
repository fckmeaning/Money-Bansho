<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Server error — Money Bansho</title>
  <style>
    :root { color-scheme: dark; --bg: #0e1116; --text: #d9d5cc; --muted: #8f8b82; --line: #2a2d33; --accent: #3d8bfd; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.55; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    header, main, footer { max-width: 760px; margin: 0 auto; padding: 0 16px; }
    header { border-bottom: 1px solid var(--line); }
    nav { display: flex; gap: 4px 18px; flex-wrap: wrap; font-size: 14px; }
    nav a { display: inline-flex; align-items: center; min-height: 44px; }
    nav .home { color: var(--text); font-weight: 700; margin-right: auto; }
    main { padding-top: 48px; padding-bottom: 48px; }
    .eyebrow { margin: 0 0 12px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; font-size: 12px; font-weight: 700; }
    h1 { font-size: clamp(26px, 5vw, 40px); line-height: 1.1; margin: 0 0 16px; }
    .lede { margin: 0; color: var(--muted); font-size: 17px; }
    .actions { display: flex; gap: 8px 20px; flex-wrap: wrap; margin-top: 24px; }
    .actions a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border: 1px solid var(--line); }
    footer { border-top: 1px solid var(--line); padding-top: 16px; padding-bottom: 24px; color: var(--muted); font-size: 13px; }
    footer p { margin: 0; }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Primary">
      <a class="home" href="/">Money Bansho</a>
      <a href="/dashboard">Dashboard</a>
      <a href="/dossier.html">Company Dossier</a>
    </nav>
  </header>
  <main>
    <p class="eyebrow">500 · Server error</p>
    <h1>The server could not handle this request</h1>
    <p class="lede">The error is usually temporary. Reload the page in a moment.</p>
    <div class="actions">
      <a href="/dashboard">Open the dashboard</a>
      <a href="/dossier.html">Open the company dossier</a>
    </div>
  </main>
  <footer>
    <p>Based on <a href="https://github.com/koala73/worldmonitor">World Monitor</a>, &copy; 2026 Elie Habib, AGPL-3.0.</p>
  </footer>
</body>
</html>
